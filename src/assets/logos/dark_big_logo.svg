<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="pc-arc-top" d="M 55 150 A 95 95 0 0 1 245 150" fill="none"/>
  </defs>

  <!-- outer rings -->
  <circle cx="150" cy="150" r="140" fill="#221F19"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="#B19561" stroke-width="2.4"/>
  <circle cx="150" cy="150" r="122" fill="none" stroke="#B19561" stroke-width="1"/>

  <!-- curved top text -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="5" fill="#B19561">
    <textPath href="#pc-arc-top" startOffset="50%" text-anchor="middle">PRIME CUTS BARBERSHOP</textPath>
  </text>

  <!-- inner monogram badge -->
  <circle cx="150" cy="150" r="58" fill="none" stroke="#B19561" stroke-width="1.2"/>
  <text x="150" y="163" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="600" letter-spacing="1" fill="#B19561">PC</text>

  <!-- crossed razor / scissors flourish beneath monogram -->
  <g transform="translate(150,195)" stroke="#B19561" stroke-width="2.6" fill="none" stroke-linecap="round">
    <line x1="-22" y1="-8" x2="22" y2="8"/>
    <line x1="-22" y1="8" x2="22" y2="-8"/>
    <circle cx="-22" cy="-8" r="4.5" fill="#B19561" stroke="none"/>
    <circle cx="-22" cy="8" r="4.5" fill="#B19561" stroke="none"/>
  </g>

  <!-- small side flourish marks, laurel-style, either side of the crest -->
  <g stroke="#B19561" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M 62 150 Q 50 165 58 185 Q 66 200 55 215"/>
    <path d="M 238 150 Q 250 165 242 185 Q 234 200 245 215"/>
  </g>
</svg>
