<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .pc-ink   { fill: #221F19; }
      .pc-brass { fill: #B19561; }
      .pc-brass-stroke { stroke: #B19561; }
    </style>
  </defs>

  <!-- outer ring -->
  <circle cx="60" cy="60" r="57" fill="#221F19"/>
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="#B19561" stroke-width="1.6"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#B19561" stroke-width="0.9"/>

  <!-- monogram: PC -->
  <g fill="#B19561" font-family="Georgia, 'Times New Roman', serif">
    <text x="60" y="70" text-anchor="middle" font-size="40" font-weight="600" letter-spacing="0.5">PC</text>
  </g>

  <!-- crossed scissors motif, small, beneath monogram -->
  <g transform="translate(60,90)" stroke="#B19561" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="-11" y1="-4" x2="11" y2="4"/>
    <line x1="-11" y1="4" x2="11" y2="-4"/>
    <circle cx="-11" cy="-4" r="2.4" fill="#B19561" stroke="none"/>
    <circle cx="-11" cy="4" r="2.4" fill="#B19561" stroke="none"/>
  </g>
</svg>
